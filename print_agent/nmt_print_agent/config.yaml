name: NMT Print Agent
version: "1.4.1"
slug: nmt_print_agent
description: >-
  Downtown store agent: prints pickup orders pushed by the dashboard and
  reports whether paper came out; runs typed requests (diagnostics, Revel
  caller-ID alerts) for the dashboard; runs CryptoCart's register box for the
  counter scanners and receipt printer.
arch:
  - aarch64
  - amd64
init: false
boot: auto
startup: application
# The agent listens on 8080 inside the add-on network only. The Cloudflare
# tunnel reaches it as http://local-nmt-print-agent:8080; 8080 is never mapped.
watchdog: "tcp://[HOST]:[PORT:8080]"
# CryptoCart's register box: the registers on the shop's Wi-Fi reach it on
# 8443. It opens 8443 only once its first certificate arrives.
ports:
  8443/tcp: 8443
ports_description:
  8443/tcp: Registers on the shop's Wi-Fi
# The box's one-time pairing code arrives as a line by hassio.addon_stdin.
stdin: true
# Raises persistent notifications in Home Assistant when a job cannot print, and
# publishes sensor.instore_order_printing for the Store view.
homeassistant_api: true
options:
  dashboard_url: https://dashboard.nmteaco.com
  signing_key: ""
  agent_name: downtown
  printer_uri: ipp://192.168.22.238/ipp/print
  printer_ip: 192.168.22.238
  snmp_community: public
  listen_port: 8080
  # Store agent (1.3.0). New options take these defaults on upgrade; the
  # options above (and signing_key) are left exactly as they are.
  lan_ip: 192.168.22.254
  lan_subnet: 192.168.22.0/24
  store_timezone: America/Denver
  # off = dry runs only; test = live only to a register marked test, with
  # the test identity below; on = live to any configured register.
  revel_caller_id_mode: test
  revel_caller_id_port: 3520
  revel_caller_id_copies: 1
  # 555-0100..0199 numbers are reserved for fiction: never a real caller.
  revel_test_number: "505-555-0100"
  # Revel registers, from Revel PosStation + UniFi (2026-10-12). DHCP, not
  # reserved: check /v1/targets against Revel's station IP if a send fails.
  revel_targets:
    - id: pink-ipad
      name: Pink Ipad
      ip: 192.168.22.91
      revel_station: 14
      test: true
    - id: blue-ipad
      name: Blue Ipad
      ip: 192.168.22.190
      revel_station: 12
      test: false
schema:
  dashboard_url: url
  signing_key: password
  agent_name: str
  printer_uri: str
  printer_ip: str
  snmp_community: str
  listen_port: port
  lan_ip: str
  lan_subnet: str
  store_timezone: str
  revel_caller_id_mode: list(off|test|on)
  revel_caller_id_port: port
  revel_caller_id_copies: int(1,8)
  revel_test_number: "match(^\\d{3}-?\\d{3}-?\\d{4}$)"
  revel_targets:
    - id: "match(^[a-z0-9][a-z0-9-]{0,31}$)"
      name: str
      ip: str
      revel_station: int?
      test: bool
  # CryptoCart company address; empty leaves the register box off.
  cryptocart_company: str?
